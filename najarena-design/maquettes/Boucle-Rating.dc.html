<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Boucle — rating qui grimpe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Chakra+Petch:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
@keyframes b3-draw{0%,8%{stroke-dashoffset:420}60%,100%{stroke-dashoffset:0}}
@keyframes b3-pop{0%,58%{opacity:0;transform:translateY(10px)}66%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
.b3-draw{stroke-dasharray:420;animation:b3-draw 5s ease-out infinite}
.b3-pop{animation:b3-pop 5s ease-out infinite}
@media (prefers-reduced-motion: reduce){.b3-draw,.b3-pop{animation:none !important;stroke-dashoffset:0}}
</style>
</helmet>
<div style="position: relative; width: 389px; height: 300px; overflow: hidden; border-radius: 4px; background: linear-gradient(160deg, #141614, #0C0E0C); font-family: 'Chakra Petch', sans-serif; color: #F5F5F4; display: flex; flex-direction: column; justify-content: center; padding: 0 36px; box-sizing: border-box; gap: 18px;">
  <div style="display: flex; align-items: flex-end; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 10px; letter-spacing: 3px; color: #9CA39C;">RATING</div>
      <div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 72px; line-height: 0.9; font-variant-numeric: tabular-nums;">{{value}}</div>
    </div>
    <div class="b3-pop" style="font-size: 16px; font-weight: 700; color: #B6FF3B; padding-bottom: 8px;">▲ +64</div>
  </div>
  <svg width="317" height="90" viewBox="0 0 317 90" fill="none">
    <line x1="0" y1="89" x2="317" y2="89" stroke="rgba(245,245,244,.1)" stroke-width="1"></line>
    <polyline class="b3-draw" points="0,78 32,72 64,75 96,60 128,64 160,48 192,52 224,34 256,30 317,10" stroke="#B6FF3B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":389,"height":300}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.startV = 1778; this.endV = 1842; this.t = 0;
    const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ v: this.endV }); return; }
    this.timer = setInterval(() => {
      this.t = (this.t + 1) % 50;
      const k = Math.min(1, Math.max(0, (this.t - 4) / 26));
      const eased = 1 - Math.pow(1 - k, 3);
      this.setState({ v: Math.round(this.startV + (this.endV - this.startV) * eased) });
    }, 100);
  }
  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
  renderVals() {
    const v = (this.state && this.state.v) || 1778;
    return { value: String(v) };
  }
}
</script>
</body>
</html>
